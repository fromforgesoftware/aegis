# Default values for the Aegis chart.
nameOverride: ''
fullnameOverride: ''

replicaCount: 3

image:
  repository: ghcr.io/fromforgesoftware/aegis
  pullPolicy: IfNotPresent
  tag: '' # defaults to .Chart.AppVersion

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ''

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true

# Ports: REST/OpenAPI + gRPC.
ports:
  http: 8080
  grpc: 9090

service:
  type: ClusterIP
  httpPort: 80
  grpcPort: 9090

# Database connection. AEGIS owns its own schema (search_path) inside the
# target Postgres; consumers sharing a Postgres MUST use distinct schemas.
database:
  host: ''
  port: '5432'
  name: ''
  schema: aegis
  ssl: require
  # Credentials: reference an existing secret with keys DB_USER/DB_PASSWORD,
  # or set username/password to have the chart create one.
  existingSecret: ''
  username: ''
  password: ''

# Key-encryption key (base64-encoded 32 bytes) that envelope-encrypts realm
# signing keys at rest. Reference an existing secret holding key
# AEGIS_KEY_ENCRYPTION_KEY, or set keyEncryptionKey to have the chart create
# one. Required — the service fails fast without it.
crypto:
  existingSecret: ''
  keyEncryptionKey: ''

# Pre-install / pre-upgrade migration job (runs /app/migrator).
migrationJob:
  enabled: true
  backoffLimit: 3

# First-admin bootstrap (Keycloak KEYCLOAK_ADMIN-style). When enabled, the
# server ensures — idempotently, every boot — an admin realm, an admin account,
# and a public PKCE OIDC client for the Foundry console. Disabled by default;
# real deployments enable it with credentials from a secret.
bootstrap:
  enabled: false
  realm: master
  realmDisplayName: Master
  adminEmail: ''
  adminPassword: ''
  clientId: foundry
  redirectUris: ''
  # Organizations to seed, declaratively (rendered to JSON for the server).
  # The admin owns them; the first is set as the admin's active org.
  #
  # orgs:
  #   - name: Acme
  #     slug: acme
  #   - name: Globex
  #     slug: globex
  orgs: []

# Declarative authz catalogs, provisioned Grafana-style: each entry declares a
# resource type's permissions (with an implication tree) and SYSTEM roles
# (with a composition tree). Rendered into a ConfigMap and reconciled at
# startup — add/update/remove converge, and a checksum annotation rolls the
# pods when this block changes, so editing values IS the deploy. Removing an
# entry prunes it; pruning a role with live bindings is refused unless the
# document sets force: true. References may be bare ("read") or qualified
# ("strategies.read").
#
# catalogs:
#   - resourceType: strategies
#     permissions:
#       read: {}
#       write: { implies: [read] }
#       delete: {}
#     roles:
#       reader: { permissions: [read] }
#       editor: { composes: [reader], permissions: [write] }
#       admin:  { composes: [editor], permissions: [delete] }
catalogs: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: '1'
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

# Shared HMAC secret gating /api admin routes to the Foundry gateway
# (empty = open). Must match across Foundry and the products it manages.
gatewaySecret: ''
